name: CMake

on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - run: sudo apt update && sudo apt install llvm g++ ninja-build
    - uses: actions/checkout@v6
    - uses: nttld/setup-ndk@v1
      id: setup-ndk
      with:
        ndk-version: r21e
        add-to-path: true
    - name: Build
      run: |
        make release_zips
    
    - uses: actions/upload-artifact@v7
      with:
        name: mods
        path: |
          out/*.zip      
